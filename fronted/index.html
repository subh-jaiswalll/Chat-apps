<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="chat-container">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <div class="sidebar">

            <div class="sidebar-header">

                <h2>Chats</h2>

                <button
                    id="logoutButton"
                    class="logout-button"
                >
                    Logout
                </button>

            </div>


            <!-- MY PROFILE -->

            <div class="my-profile">

                <div
                    class="profile-circle"
                    id="profileImage"
                >
                    A
                </div>

                <div>

                    <h3 id="userName">
                        Loading...
                    </h3>

                    <p>Online</p>

                </div>

            </div>


            <!-- SEARCH -->

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search users..."
                >

            </div>


            <!-- USER LIST -->

            <div
                class="user-list"
                id="userList"
            >

            </div>

        </div>


        <!-- =========================
             CHAT SECTION
        ========================== -->

        <div class="chat-section">

            <!-- CHAT HEADER -->

            <div class="chat-header">

                <div class="user-info">

                    <div
                        class="profile-circle"
                        id="chatProfileImage"
                    >
                        ?
                    </div>

                    <div>

                        <h3 id="chatUserName">
                            Select a user
                        </h3>

                        <p id="chatStatus">
                            Select someone to start chatting
                        </p>

                    </div>

                </div>

            </div>


            <!-- MESSAGES -->

            <div
                class="chat-messages"
                id="chatMessages"
            >

                <div class="empty-message">

                    <h2>
                        Welcome to Chat App
                    </h2>

                    <p>
                        Select a user from the left
                        to start chatting.
                    </p>

                </div>

            </div>


            <!-- MESSAGE INPUT -->

            <div class="message-area">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Select a user first..."
                    disabled
                >

                <button
                    id="sendButton"
                    disabled
                >
                    Send
                </button>

            </div>

        </div>

    </div>


    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
