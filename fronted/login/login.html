<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="text"
                id="identifier"
                placeholder="Email or Phone"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/fronted/signup/signup.html">Sign Up</a>
        </p>

    </div>

    <script src="login.js"></script>

</body>

</html>
