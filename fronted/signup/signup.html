<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <div class="container">

        <h2>Sign Up</h2>

        <div id="signUpForm">

            <label for="inpName">Name</label>
            <input type="text" name="name" id="inpName" placeholder="Enter your name">

            <label for="inpEmail">Email</label>
            <input type="email" name="email" id="inpEmail" placeholder="Enter your email">

            <label for="inpNumber">Phone number</label>
            <input type="tel" name="number" id="inpNumber" placeholder="Enter your phone number">

            <label for="inpPassword">Password</label>
            <input type="password" name="password" id="inpPassword" placeholder="Enter your password">

            <button type="submit">Sign Up</button>
        </div>
        <p id="message"></p>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
<script src="signup.js"></script>

</html>
